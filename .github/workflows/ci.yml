name: CI

# Run the quality gates on every pull request targeting main, and on main itself
# (so the README status badge reflects the state of the default branch).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# If new commits are pushed to the same PR, cancel the in-progress run instead of
# letting both finish — saves CI minutes. On main (push) we do NOT cancel: a
# later merge must not interrupt an in-progress image publish and leave a
# half-pushed, inconsistent image pair.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default: the CI job only needs to read the repo. The publish
# job widens this to `packages: write` for itself.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # Postgres for the integration tests (the double-booking proof). Unit tests
    # don't use it; it just has to be healthy before the integration step runs.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: praxis
          POSTGRES_PASSWORD: praxis
          POSTGRES_DB: praxis_buchung
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praxis -d praxis_buchung"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Clone the repository into the runner.
      - name: Check out the repository
        uses: actions/checkout@v7

      # Install Node (version from .nvmrc, our single source of truth) and enable
      # npm caching: ~/.npm is restored/saved keyed by package-lock.json, so a
      # later run reuses the download cache and `npm ci` is much faster.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Clean, reproducible install from the lockfile. Reads the committed .npmrc
      # (legacy-peer-deps), which this monorepo's cross-workspace toolchain needs.
      - name: Install dependencies
        run: npm ci

      # The root scripts fan each gate out across both workspaces.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Apply migrations + seed into the service Postgres, then run the
      # integration tests (e.g. the concurrent double-booking proof).
      - name: Integration tests (real Postgres)
        env:
          DATABASE_URL: postgresql://praxis:praxis@localhost:5432/praxis_buchung
        run: |
          npm run prisma:migrate:deploy --workspace backend
          npm run db:seed --workspace backend
          npm run test:int --workspace backend

  # Build and publish the production images to GHCR — but only after the whole CI
  # job above has passed (needs: ci) and only for a push to main (i.e. after a PR
  # is merged), never for a pull request. Branch protection already keeps red PRs
  # out of main, and this gate makes sure we never publish an image from a commit
  # whose tests didn't pass.
  publish:
    name: Publish images to GHCR
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the built-in GITHUB_TOKEN may push to this repo's packages
    strategy:
      matrix:
        image:
          - name: backend
            dockerfile: infra/backend.Dockerfile
            target: runtime
          - name: frontend
            dockerfile: infra/frontend.Dockerfile
            target: runtime
          # One-off migration runner (Prisma CLI + schema), used by the `migrate`
          # service in compose.prod.yml before the backend starts.
          - name: migrate
            dockerfile: infra/backend.Dockerfile
            target: migrator
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Buildx enables the GitHub Actions build cache below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR as the actor who pushed, using the built-in token (no PAT).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive the image name + tags: `latest` and a `sha-<commit>` tag so every
      # image is traceable back to the exact commit it was built from.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image.name }}
          tags: |
            type=raw,value=latest
            type=sha

      # Build the production image (context is the repo root, as the Dockerfiles
      # expect) and push both tags. The GHA cache is scoped per image so the two
      # builds don't clobber each other's layers.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  # Deploy to the production server over SSH after the images are published.
  # Dormant until the server exists: it only runs when the repo variable
  # DEPLOY_ENABLED is "true" (set it once the SSH_* / DOMAIN secrets are in
  # place), so main stays green in the meantime.
  deploy:
    name: Deploy to server
    needs: publish
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The short SHA matches the `sha-<commit>` image tag metadata-action pushes,
      # so the deploy runs the exact image built from this commit (not a moving
      # `latest` that a concurrent merge could change under it).
      - name: Compute the image tag
        id: tag
        run: echo "image_tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # Copy the compose file and Caddyfile to the server (strip the infra/
      # prefix so they land next to the server-side .env). Third-party actions are
      # pinned by commit SHA (supply-chain hardening), with the version in a trailer.
      - name: Copy deploy files to the server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: infra/compose.prod.yml,infra/Caddyfile,infra/backup.sh
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      # Pull the images for this commit and (re)start the stack. The migrate
      # service runs `prisma migrate deploy` before the backend starts (compose
      # service_completed_successfully ordering), and Caddy fetches/renews the
      # TLS certificate automatically for ${DOMAIN}. Secrets are passed through
      # `envs` (not interpolated into the script) and the registry login is
      # dropped again afterwards so no credential lingers on the server.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_PATH,GHCR_USER,GHCR_PAT,IMAGE_TAG
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
