name: CI

# Run the quality gates on every pull request targeting main, and on main itself
# (so the README status badge reflects the state of the default branch).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# If new commits are pushed to the same PR, cancel the in-progress run instead of
# letting both finish — saves CI minutes. On main (push) we do NOT cancel: a
# later merge must not interrupt an in-progress image publish and leave a
# half-pushed, inconsistent image pair.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default: the CI job only needs to read the repo. The publish
# job widens this to `packages: write` for itself.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # Postgres for the integration tests (the double-booking proof). Unit tests
    # don't use it; it just has to be healthy before the integration step runs.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: praxis
          POSTGRES_PASSWORD: praxis
          POSTGRES_DB: praxis_buchung
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praxis -d praxis_buchung"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Clone the repository into the runner.
      - name: Check out the repository
        uses: actions/checkout@v7

      # Install Node (version from .nvmrc, our single source of truth) and enable
      # npm caching: ~/.npm is restored/saved keyed by package-lock.json, so a
      # later run reuses the download cache and `npm ci` is much faster.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Clean, reproducible install from the lockfile. Reads the committed .npmrc
      # (legacy-peer-deps), which this monorepo's cross-workspace toolchain needs.
      - name: Install dependencies
        run: npm ci

      # The root scripts fan each gate out across both workspaces.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Apply migrations + seed into the service Postgres, then run the
      # integration tests (e.g. the concurrent double-booking proof).
      - name: Integration tests (real Postgres)
        env:
          DATABASE_URL: postgresql://praxis:praxis@localhost:5432/praxis_buchung
        run: |
          npm run prisma:migrate:deploy --workspace backend
          npm run db:seed --workspace backend
          npm run test:int --workspace backend

  # Build and publish the production images to GHCR — but only after the whole CI
  # job above has passed (needs: ci) and only for a push to main (i.e. after a PR
  # is merged), never for a pull request. Branch protection already keeps red PRs
  # out of main, and this gate makes sure we never publish an image from a commit
  # whose tests didn't pass.
  publish:
    name: Publish images to GHCR
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the built-in GITHUB_TOKEN may push to this repo's packages
    strategy:
      matrix:
        image:
          - name: backend
            dockerfile: infra/backend.Dockerfile
            target: runtime
          - name: frontend
            dockerfile: infra/frontend.Dockerfile
            target: runtime
          # One-off migration runner (Prisma CLI + schema), used by the `migrate`
          # service in compose.prod.yml before the backend starts.
          - name: migrate
            dockerfile: infra/backend.Dockerfile
            target: migrator
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # QEMU registers binfmt handlers so this amd64 runner can also build the
      # arm64 variant by emulation. Needed because the build step below targets two
      # platforms (amd64 + arm64) from a single amd64 host; the arm64 build is
      # emulated and therefore slower (see ADR-0011).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Buildx enables the GitHub Actions build cache below and the multi-platform
      # build (it produces one OCI manifest list spanning both architectures).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Log in to GHCR as the actor who pushed, using the built-in token (no PAT).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive the image name + tags: `latest` and a `sha-<commit>` tag so every
      # image is traceable back to the exact commit it was built from.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image.name }}
          tags: |
            type=raw,value=latest
            type=sha

      # Build the production image (context is the repo root, as the Dockerfiles
      # expect) for both architectures and push each tag as its own manifest list,
      # so `docker pull` on an amd64 or arm64 host gets the matching variant.
      # The GHA cache is scoped per image so the three images don't clobber each
      # other's layers (both platforms share one image's scope).
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  # Deploy after the images are published: staging automatically, then production
  # behind a manual approval. Both jobs call the reusable deploy.yml (one
  # definition, invoked once per environment) so the two deploys can never drift
  # apart. The whole chain is dormant until the DEPLOY_ENABLED repo variable is
  # "true", so main stays green long before a server exists.
  #
  # The approval itself is NOT in this file: it is a protection rule on the
  # `production` GitHub Environment (Settings -> Environments -> production ->
  # Required reviewers). Binding deploy-production to that environment makes GitHub
  # pause it until a reviewer approves in the Actions UI.
  deploy-staging:
    name: Deploy to staging
    needs: publish
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    # Hand the repo/environment secrets (SSH_*, DEPLOY_PATH, GHCR_PAT) to the
    # reusable workflow; the ones scoped to `staging` resolve there through its
    # `environment:` binding, so staging points at its own server.
    secrets: inherit

  deploy-production:
    name: Deploy to production
    # Only promote what already runs on staging: production waits for a green
    # staging deploy, and then the `production` environment's required reviewers
    # pause this job until a human approves.
    needs: deploy-staging
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
