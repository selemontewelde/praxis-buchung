name: Security

# Detection layer that complements Dependabot: Dependabot *updates* dependencies,
# these scans *find* problems and gate merges. Results (CodeQL) surface in the
# repository's Security tab. Runs on every PR to main, on main itself, and weekly
# (so new advisories against unchanged code are still caught).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

# Cancel a superseded PR run; never cancel on main.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; only the CodeQL job widens this for itself.
permissions:
  contents: read

jobs:
  # Static analysis of the TypeScript/JavaScript source. build-mode "none" means
  # CodeQL analyses the source directly — no compilation needed for JS/TS.
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF results to code scanning
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  # PR gate: fails a pull request that introduces a dependency with a known
  # vulnerability (or a disallowed licence), before it can be merged.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # Audits the committed lockfile (the existing dependency tree) for known
  # advisories. Gated at "high" to stay signal-rich; tighten to "critical" if
  # transitive noise becomes a problem.
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Audit (high and above)
        run: npm audit --audit-level=high
