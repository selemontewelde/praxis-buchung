# Serves the compiled Angular app. nginx-unprivileged listens on 8080 as a
# non-root user. Unknown paths fall back to index.html for client-side routing.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, so a new deploy's fingerprinted asset
    # references are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Angular fingerprints JS/CSS/fonts with a content hash in the filename, so a
    # changed file gets a new URL — those are safe to cache forever (immutable).
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
